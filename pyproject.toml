[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftglass"
version = "0.1.0"
description = "Local-first application update behaviour auditing utilities"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.21,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
