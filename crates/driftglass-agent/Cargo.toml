[package]
name = "driftglass-agent"
version = "0.1.0"
edition = "2021"
description = "Experimental Linux /proc process and TCP metadata sampler for Driftglass"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
