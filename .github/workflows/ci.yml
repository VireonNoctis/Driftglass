name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libssl-dev nlohmann-json3-dev libsqlite3-dev jq
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable snapshot 2026-10-16
      - name: Test Rust observer
        run: cargo test --locked --workspace
      - name: Build Linux observer
        run: cargo build --locked --release -p driftglass-agent
      - name: Configure C++20 CLI and paired-capture integration
        run: |
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release \
            -DDRIFTGLASS_AGENT_EXECUTABLE="$GITHUB_WORKSPACE/target/release/driftglass-agent"
      - name: Build native CLI and fixtures
        run: cmake --build build/cpp --parallel 2
      - name: Run native unit, export, schema, package and live paired-capture tests
        run: ctest --test-dir build/cpp --output-on-failure

  reproducible-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable snapshot 2026-10-16
      - name: Compare release binaries from independent source and target paths
        shell: bash
        run: |
          set -euo pipefail
          second_source="$RUNNER_TEMP/driftglass-repro-source"
          mkdir -p "$second_source"
          git archive "$GITHUB_SHA" | tar -x -C "$second_source"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/driftglass" CARGO_TARGET_DIR="$RUNNER_TEMP/target-a" cargo build --locked --release -p driftglass-agent
          RUSTFLAGS="--remap-path-prefix=$second_source=/driftglass" CARGO_TARGET_DIR="$RUNNER_TEMP/target-b" cargo build --locked --release --manifest-path "$second_source/Cargo.toml" -p driftglass-agent
          cmp "$RUNNER_TEMP/target-a/release/driftglass-agent" "$RUNNER_TEMP/target-b/release/driftglass-agent"
          sha256sum "$RUNNER_TEMP/target-a/release/driftglass-agent" "$RUNNER_TEMP/target-b/release/driftglass-agent"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
