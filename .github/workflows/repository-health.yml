name: Repository health

on:
  push:
    branches: [main]
    paths-ignore:
      - TECH_STACK.md
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Source and manifest quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Run repository quality checks
        run: python .github/scripts/repository_health.py --quality

  stack:
    name: Refresh detected tech stack
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: repository-health-stack
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Commit report when the detected stack changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/repository_health.py --stack

            if git diff --quiet -- TECH_STACK.md; then
              echo "Tech stack is unchanged."
              exit 0
            fi

            git add TECH_STACK.md
            git commit -m "chore: refresh detected tech stack [skip ci]"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi

            echo "::warning::main advanced while publishing the generated stack report; retrying ($attempt/3)."
          done

          echo "::error::Could not publish the generated stack report after three attempts."
          exit 1
